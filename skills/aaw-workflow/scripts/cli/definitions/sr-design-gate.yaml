name: sr-design-gate
execution: skill
skill: [sr-design-gate]
input:
  - path: ".sdd/software_architecture.md"
    required: true
  - path: ".sdd/{SR}/original-requirement.md"
    required: true
  - path: ".sdd/{SR}/SR-design.md"
    required: true
output:
  - path: ".sdd/{SR}/SR-design-gate.md"
    required: true
data_prompt:
  description: "提交 SR 设计门禁结论。每一轮检查都必须生成或更新门禁报告，report 恒为实际报告路径，不得填 null，并提交完整 summary。只有结论为通过时提交 gate_result=pass；不通过或阻塞时先写报告和 data file，再执行 done，CLI reject 是预期结果，随后停止且不得推进到 ar-split。"
